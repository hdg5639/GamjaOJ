# Static pages need the same framing/content protections as Spring API responses.
# Include again in locations with add_header because Nginx otherwise drops inherited headers.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
