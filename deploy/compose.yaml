name: gamjaoj
services:
  application:
    image: ${GAMJAOJ_IMAGE:?Set the built application image}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 448m
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18081}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamjaoj
      DB_USER: gamjaoj
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      INVITE_CODE: ${INVITE_CODE:?Set INVITE_CODE}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN}
      SUBMISSIONS_ENABLED: ${SUBMISSIONS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_ENABLED: ${AI_API_ENABLED:-false}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      AI_OPERATOR_USERS: ${AI_OPERATOR_USERS:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-5.6-luna}
      AI_DEFAULT_REASONING: ${AI_DEFAULT_REASONING:-low}
      AI_STRONG_MODEL: ${AI_STRONG_MODEL:-gpt-5.6-terra}
      AI_STRONG_REASONING: ${AI_STRONG_REASONING:-medium}
      CODEX_GENERATION_MODEL: ${CODEX_GENERATION_MODEL:-gpt-5.6-sol}
      CODEX_GENERATION_REASONING: ${CODEX_GENERATION_REASONING:-medium}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:-}
      AI_DEFAULT_INPUT_USD_PER_M: ${AI_DEFAULT_INPUT_USD_PER_M:-}
      AI_DEFAULT_CACHED_USD_PER_M: ${AI_DEFAULT_CACHED_USD_PER_M:-}
      AI_DEFAULT_OUTPUT_USD_PER_M: ${AI_DEFAULT_OUTPUT_USD_PER_M:-}
      AI_DEFAULT_PRICING_VERSION: ${AI_DEFAULT_PRICING_VERSION:-}
      AI_STRONG_INPUT_USD_PER_M: ${AI_STRONG_INPUT_USD_PER_M:-}
      AI_STRONG_CACHED_USD_PER_M: ${AI_STRONG_CACHED_USD_PER_M:-}
      AI_STRONG_OUTPUT_USD_PER_M: ${AI_STRONG_OUTPUT_USD_PER_M:-}
      AI_STRONG_PRICING_VERSION: ${AI_STRONG_PRICING_VERSION:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, ingress]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    environment:
      POSTGRES_DB: gamjaoj
      POSTGRES_USER: gamjaoj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gamjaoj -d gamjaoj]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
networks:
  backend:
    external: true
    name: gamjaoj_backend
  ingress:
    name: gamjaoj_ingress
    labels:
      com.gamjaoj.owner: gamjaoj
volumes:
  postgres-data:
