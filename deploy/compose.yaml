name: gamjaoj
services:
  application:
    image: ${GAMJAOJ_IMAGE:?Set the built application image}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 448m
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      COMPLETION_URL: http://completion:8090
      DB_URL: jdbc:postgresql://postgres:5432/gamjaoj
      DB_USER: gamjaoj
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN}
      SUBMISSIONS_ENABLED: ${SUBMISSIONS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_ENABLED: ${AI_API_ENABLED:-false}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      AI_OPERATOR_USERS: ${AI_OPERATOR_USERS:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-5.6-luna}
      AI_DEFAULT_REASONING: ${AI_DEFAULT_REASONING:-low}
      AI_STRONG_MODEL: ${AI_STRONG_MODEL:-gpt-5.6-terra}
      AI_STRONG_REASONING: ${AI_STRONG_REASONING:-medium}
      CODEX_GENERATION_MODEL: ${CODEX_GENERATION_MODEL:-gpt-5.6-sol}
      CODEX_GENERATION_REASONING: ${CODEX_GENERATION_REASONING:-medium}
      CODEX_RULE_AUTHOR_REASONING: ${CODEX_RULE_AUTHOR_REASONING:-high}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:-}
      HYBRID_PUBLIC_ADMISSION_ENABLED: ${HYBRID_PUBLIC_ADMISSION_ENABLED:-false}
      HYBRID_ADMISSION_ENABLED: ${HYBRID_ADMISSION_ENABLED:-false}
      HYBRID_API_WORKER_ENABLED: ${HYBRID_API_WORKER_ENABLED:-false}
      HYBRID_COORDINATOR_EVENTS_ENABLED: ${HYBRID_COORDINATOR_EVENTS_ENABLED:-false}
      HYBRID_FUNCTIONAL_ENABLED: ${HYBRID_FUNCTIONAL_ENABLED:-false}
      HYBRID_PIPELINE_V2_ENABLED: ${HYBRID_PIPELINE_V2_ENABLED:-false}
      HYBRID_CONTENT_REVIEW_ENABLED: ${HYBRID_CONTENT_REVIEW_ENABLED:-false}
      HYBRID_ALLOWED_USERS: ${HYBRID_ALLOWED_USERS:-}
      HYBRID_MAX_ACTIVE: ${HYBRID_MAX_ACTIVE:-1}
      RUNNER_FUNCTIONAL_SLOTS: ${RUNNER_FUNCTIONAL_SLOTS:-2}
      RUNNER_USER_EXECUTION_MODE: ${RUNNER_USER_EXECUTION_MODE:-EXCLUSIVE}
      HYBRID_VALIDATION_PROFILE: ${HYBRID_VALIDATION_PROFILE:-}
      AI_HYBRID_WRITER_MODEL: ${AI_HYBRID_WRITER_MODEL:-}
      AI_HYBRID_WRITER_REASONING: ${AI_HYBRID_WRITER_REASONING:-}
      AI_HYBRID_WRITER_INPUT_USD_PER_M: ${AI_HYBRID_WRITER_INPUT_USD_PER_M:-}
      AI_HYBRID_WRITER_CACHED_USD_PER_M: ${AI_HYBRID_WRITER_CACHED_USD_PER_M:-}
      AI_HYBRID_WRITER_OUTPUT_USD_PER_M: ${AI_HYBRID_WRITER_OUTPUT_USD_PER_M:-}
      AI_HYBRID_WRITER_MAX_OUTPUT_TOKENS: ${AI_HYBRID_WRITER_MAX_OUTPUT_TOKENS:-}
      AI_HYBRID_WRITER_PRICING_VERSION: ${AI_HYBRID_WRITER_PRICING_VERSION:-}
      AI_HYBRID_READER_MODEL: ${AI_HYBRID_READER_MODEL:-}
      AI_HYBRID_READER_REASONING: ${AI_HYBRID_READER_REASONING:-}
      AI_HYBRID_READER_INPUT_USD_PER_M: ${AI_HYBRID_READER_INPUT_USD_PER_M:-}
      AI_HYBRID_READER_CACHED_USD_PER_M: ${AI_HYBRID_READER_CACHED_USD_PER_M:-}
      AI_HYBRID_READER_OUTPUT_USD_PER_M: ${AI_HYBRID_READER_OUTPUT_USD_PER_M:-}
      AI_HYBRID_READER_MAX_OUTPUT_TOKENS: ${AI_HYBRID_READER_MAX_OUTPUT_TOKENS:-}
      AI_HYBRID_READER_PRICING_VERSION: ${AI_HYBRID_READER_PRICING_VERSION:-}
      AI_HYBRID_REVIEW_MODEL: ${AI_HYBRID_REVIEW_MODEL:-}
      AI_HYBRID_REVIEW_REASONING: ${AI_HYBRID_REVIEW_REASONING:-}
      AI_HYBRID_REVIEW_INPUT_USD_PER_M: ${AI_HYBRID_REVIEW_INPUT_USD_PER_M:-}
      AI_HYBRID_REVIEW_CACHED_USD_PER_M: ${AI_HYBRID_REVIEW_CACHED_USD_PER_M:-}
      AI_HYBRID_REVIEW_OUTPUT_USD_PER_M: ${AI_HYBRID_REVIEW_OUTPUT_USD_PER_M:-}
      AI_HYBRID_REVIEW_MAX_OUTPUT_TOKENS: ${AI_HYBRID_REVIEW_MAX_OUTPUT_TOKENS:-}
      AI_HYBRID_REVIEW_PRICING_VERSION: ${AI_HYBRID_REVIEW_PRICING_VERSION:-}
      HYBRID_CODEX_API_FALLBACK_ENABLED: ${HYBRID_CODEX_API_FALLBACK_ENABLED:-false}
      HYBRID_REFERENCE_REUSE_ENABLED: ${HYBRID_REFERENCE_REUSE_ENABLED:-false}
      HYBRID_RULE_ONBOARDING_ENABLED: ${HYBRID_RULE_ONBOARDING_ENABLED:-false}
      HYBRID_RULE_ONBOARDING_BUDGET_USD: ${HYBRID_RULE_ONBOARDING_BUDGET_USD:-1}
      HYBRID_GENERATION_SECONDS: ${HYBRID_GENERATION_SECONDS:-600}
      HYBRID_RULE_ONBOARDING_MINUTES: ${HYBRID_RULE_ONBOARDING_MINUTES:-20}
      HYBRID_RULE_ONBOARDING_MAX_ACTIVE: ${HYBRID_RULE_ONBOARDING_MAX_ACTIVE:-1}
      HYBRID_RULE_AUTHOR_MAX_OUTPUT_TOKENS: ${HYBRID_RULE_AUTHOR_MAX_OUTPUT_TOKENS:-16000}
      HYBRID_RULE_ORACLE_MAX_OUTPUT_TOKENS: ${HYBRID_RULE_ORACLE_MAX_OUTPUT_TOKENS:-12000}
      HYBRID_CODEX_QUOTA_COOLDOWN_MINUTES: ${HYBRID_CODEX_QUOTA_COOLDOWN_MINUTES:-60}
      AI_HYBRID_AUTHOR_MODEL: ${AI_HYBRID_AUTHOR_MODEL:-}
      AI_HYBRID_AUTHOR_REASONING: ${AI_HYBRID_AUTHOR_REASONING:-}
      AI_HYBRID_AUTHOR_INPUT_USD_PER_M: ${AI_HYBRID_AUTHOR_INPUT_USD_PER_M:-}
      AI_HYBRID_AUTHOR_CACHED_USD_PER_M: ${AI_HYBRID_AUTHOR_CACHED_USD_PER_M:-}
      AI_HYBRID_AUTHOR_OUTPUT_USD_PER_M: ${AI_HYBRID_AUTHOR_OUTPUT_USD_PER_M:-}
      AI_HYBRID_AUTHOR_MAX_OUTPUT_TOKENS: ${AI_HYBRID_AUTHOR_MAX_OUTPUT_TOKENS:-}
      AI_HYBRID_AUTHOR_PRICING_VERSION: ${AI_HYBRID_AUTHOR_PRICING_VERSION:-}
      AI_DEFAULT_INPUT_USD_PER_M: ${AI_DEFAULT_INPUT_USD_PER_M:-}
      AI_DEFAULT_CACHED_USD_PER_M: ${AI_DEFAULT_CACHED_USD_PER_M:-}
      AI_DEFAULT_OUTPUT_USD_PER_M: ${AI_DEFAULT_OUTPUT_USD_PER_M:-}
      AI_DEFAULT_PRICING_VERSION: ${AI_DEFAULT_PRICING_VERSION:-}
      AI_STRONG_INPUT_USD_PER_M: ${AI_STRONG_INPUT_USD_PER_M:-}
      AI_STRONG_CACHED_USD_PER_M: ${AI_STRONG_CACHED_USD_PER_M:-}
      AI_STRONG_OUTPUT_USD_PER_M: ${AI_STRONG_OUTPUT_USD_PER_M:-}
      AI_STRONG_PRICING_VERSION: ${AI_STRONG_PRICING_VERSION:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, ingress, completion]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
  completion:
    image: ${GAMJAOJ_COMPLETION_IMAGE:-gamjaoj-completion:20260930}
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 128
    tmpfs:
      - /tmp:size=384m,mode=1777,noexec,nosuid,nodev
    networks: [completion]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    environment:
      POSTGRES_DB: gamjaoj
      POSTGRES_USER: gamjaoj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gamjaoj -d gamjaoj]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
networks:
  completion:
    internal: true
  backend:
    external: true
    name: gamjaoj_backend
  ingress:
    name: gamjaoj_ingress
    labels:
      com.gamjaoj.owner: gamjaoj
volumes:
  postgres-data:
