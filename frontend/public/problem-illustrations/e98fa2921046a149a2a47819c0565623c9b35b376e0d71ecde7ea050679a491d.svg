<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>중간 칸과 착지 칸이 다른 도약 규칙</title><desc>도약은 정확히 두 칸이며 이동 한 번으로 셉니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="50" y="42" font-size="18" fill="#243443">중간 칸은 벽이어도 지나갈 수 있어요</text><rect x="65" y="72" width="46" height="46" rx="7" fill="#e8eff3"/><text x="78" y="102" font-size="18" fill="#243443">S</text><rect x="116" y="72" width="46" height="46" rx="7" fill="#e8eff3"/><text x="129" y="102" font-size="18" fill="#243443">#</text><rect x="167" y="72" width="46" height="46" rx="7" fill="#e8eff3"/><text x="180" y="102" font-size="18" fill="#243443">.</text><path d="M87,138 L189,138" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="112" font-size="18" fill="#243443">착지 칸이 빈 칸 → 가능</text><text x="50" y="206" font-size="18" fill="#243443">착지할 칸은 비어 있어야 해요</text><rect x="65" y="231" width="46" height="46" rx="7" fill="#e8eff3"/><text x="78" y="261" font-size="18" fill="#243443">S</text><rect x="116" y="231" width="46" height="46" rx="7" fill="#e8eff3"/><text x="129" y="261" font-size="18" fill="#243443">.</text><rect x="167" y="231" width="46" height="46" rx="7" fill="#e8eff3"/><text x="180" y="261" font-size="18" fill="#243443">#</text><path d="M87,297 L189,297" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="271" font-size="18" fill="#243443">착지 칸이 벽 → 불가능</text></g></svg>
