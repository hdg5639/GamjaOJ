<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>토마토의 상태와 상하좌우 전파 관계</title><desc>1은 익은 토마토, 0은 익지 않은 토마토, -1은 빈 칸입니다. 익은 토마토들은 동시에 상하좌우 이웃에 영향을 주며 대각선으로는 퍼지지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="42" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="85" font-size="18" fill="#243443">0</text><rect x="93" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="85" font-size="18" fill="#243443">0</text><rect x="144" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="85" font-size="18" fill="#243443">0</text><rect x="195" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="85" font-size="18" fill="#243443">0</text><rect x="42" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="136" font-size="18" fill="#243443">0</text><rect x="93" y="106" width="46" height="46" rx="7" fill="#b9dfb2"/><text x="106" y="136" font-size="18" fill="#243443">1</text><rect x="144" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="136" font-size="18" fill="#243443">0</text><rect x="195" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="136" font-size="18" fill="#243443">0</text><rect x="42" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="187" font-size="18" fill="#243443">0</text><rect x="93" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="187" font-size="18" fill="#243443">0</text><rect x="144" y="157" width="46" height="46" rx="7" fill="#d3dce2"/><text x="157" y="187" font-size="18" fill="#243443">-1</text><rect x="195" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="187" font-size="18" fill="#243443">0</text><rect x="42" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="238" font-size="18" fill="#243443">0</text><rect x="93" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="238" font-size="18" fill="#243443">0</text><rect x="144" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="238" font-size="18" fill="#243443">0</text><rect x="195" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="238" font-size="18" fill="#243443">0</text><path d="M399,145 L443,145" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M381,145 L337,145" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390,154 L390,198" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390,136 L390,92" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="90" font-size="18" fill="#243443">1  익은 토마토</text><text x="480" y="130" font-size="18" fill="#243443">0  익지 않은 토마토</text><text x="480" y="170" font-size="18" fill="#243443">−1  토마토가 없는 칸</text><text x="42" y="295" font-size="16" fill="#243443">여러 시작점이 있으면 모두 같은 날부터 퍼집니다. 소요 일수는 표시하지 않습니다.</text></g></svg>
