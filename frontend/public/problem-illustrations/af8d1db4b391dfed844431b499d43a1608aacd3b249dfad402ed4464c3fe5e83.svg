443">.</text><rect x="55" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="238" font-size="18" fill="#243443">.</text><rect x="106" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="238" font-size="18" fill="#243443">.</text><rect x="157" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="170" y="238" font-size="18" fill="#243443">.</text><rect x="208" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="238" font-size="18" fill="#243443">.</text><path d="M55,55 H152 V157 H106 V106 H55 Z" fill="none" stroke="#c47b40" stroke-width="4"/><text x="330" y="106" font-size="18" fill="#243443">상하좌우로 붙은 #은 연결</text><text x="330" y="157" font-size="18" fill="#243443">대각선으로만 닿은 #은 별개</text><text x="330" y="208" font-size="18" fill="#243443">주황 선: 밖에 드러난 변</text><text x="330" y="260" font-size="16" fill="#243443">칸 사이의 공유한 변은 둘레에서 제외</text></g></svg>
