<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>사람과 불의 이동 방향 및 경계 밖 탈출</title><desc>사람은 통로로 이동하고 불은 인접 통로 모두로 번집니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="55" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="85" font-size="18" fill="#243443">.</text><rect x="106" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="85" font-size="18" fill="#243443">J</text><rect x="157" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="170" y="85" font-size="18" fill="#243443">.</text><rect x="208" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="85" font-size="18" fill="#243443">.</text><rect x="55" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="136" font-size="18" fill="#243443">.</text><rect x="106" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="136" font-size="18" fill="#243443">.</text><rect x="157" y="106" width="46" height="46" rx="7" fill="#aab9c3"/><text x="170" y="136" font-size="18" fill="#243443">#</text><rect x="208" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="136" font-size="18" fill="#243443">.</text><rect x="55" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="187" font-size="18" fill="#243443">.</text><rect x="106" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="187" font-size="18" fill="#243443">F</text><rect x="157" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="170" y="187" font-size="18" fill="#243443">.</text><rect x="208" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="187" font-size="18" fill="#243443">.</text><rect x="55" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="238" font-size="18" fill="#243443">.</text><rect x="106" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="238" font-size="18" fill="#243443">.</text><rect x="157" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="170" y="238" font-size="18" fill="#243443">.</text><rect x="208" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="238" font-size="18" fill="#243443">.</text><path d="M129,65 L129,22" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M399,150 L443,150" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M381,150 L337,150" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390,159 L390,203" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390,141 L390,97" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="95" font-size="18" fill="#243443">J: 사람의 시작 위치</text><text x="480" y="138" font-size="18" fill="#243443">F: 불 / #: 벽 / .: 통로</text><text x="480" y="181" font-size="18" fill="#243443">상하좌우 이동과 확산</text><text x="480" y="225" font-size="16" fill="#243443">탈출은 격자의 경계 밖으로 이동</text><text x="55" y="304" font-size="16" fill="#243443">이미 불이 있거나 같은 시각에 불이 도달하는 칸에는 갈 수 없습니다.</text></g></svg>
