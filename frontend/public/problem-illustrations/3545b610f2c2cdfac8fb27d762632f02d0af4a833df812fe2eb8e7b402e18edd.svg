<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>정사각형 종이를 같은 크기의 네 영역으로 나누는 방식</title><desc>가로와 세로를 각각 절반으로 나눕니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="65" y="45" width="260" height="260" rx="7" fill="#e8eff3"/><path d="M195,45 V305 M65,175 H325" fill="none" stroke="#35766d" stroke-width="3"/><text x="90" y="120" font-size="18" fill="#243443">좌상단</text><text x="220" y="120" font-size="18" fill="#243443">우상단</text><text x="90" y="245" font-size="18" fill="#243443">좌하단</text><text x="220" y="245" font-size="18" fill="#243443">우하단</text><text x="400" y="113" font-size="18" fill="#243443">각 영역의 크기: N/2 × N/2</text><text x="400" y="170" font-size="18" fill="#243443">같은 색이면 더 나누지 않음</text><text x="400" y="227" font-size="17" fill="#243443">색이 섞였으면 다시 네 영역으로 나눔</text></g></svg>
