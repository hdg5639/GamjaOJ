<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>연구소 칸의 종류와 새로 세울 벽 세 개</title><desc>0은 빈 칸, 1은 기존 벽, 2는 바이러스입니다. 빈 칸에 새 벽을 정확히 세 개 세운 뒤 바이러스가 상하좌우로 퍼집니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="42" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="85" font-size="18" fill="#243443">0</text><rect x="93" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="85" font-size="18" fill="#243443">0</text><rect x="144" y="55" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="85" font-size="18" fill="#243443">0</text><rect x="195" y="55" width="46" height="46" rx="7" fill="#b9dfb2"/><text x="208" y="85" font-size="18" fill="#243443">1</text><rect x="42" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="136" font-size="18" fill="#243443">0</text><rect x="93" y="106" width="46" height="46" rx="7" fill="#edc597"/><text x="106" y="136" font-size="18" fill="#243443">2</text><rect x="144" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="136" font-size="18" fill="#243443">0</text><rect x="195" y="106" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="136" font-size="18" fill="#243443">0</text><rect x="42" y="157" width="46" height="46" rx="7" fill="#b9dfb2"/><text x="55" y="187" font-size="18" fill="#243443">1</text><rect x="93" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="187" font-size="18" fill="#243443">0</text><rect x="144" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="187" font-size="18" fill="#243443">0</text><rect x="195" y="157" width="46" height="46" rx="7" fill="#e8eff3"/><text x="208" y="187" font-size="18" fill="#243443">0</text><rect x="42" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="55" y="238" font-size="18" fill="#243443">0</text><rect x="93" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="106" y="238" font-size="18" fill="#243443">0</text><rect x="144" y="208" width="46" height="46" rx="7" fill="#e8eff3"/><text x="157" y="238" font-size="18" fill="#243443">0</text><rect x="195" y="208" width="46" height="46" rx="7" fill="#edc597"/><text x="208" y="238" font-size="18" fill="#243443">2</text><text x="320" y="90" font-size="18" fill="#243443">0  새 벽을 놓을 수 있는 빈 칸</text><text x="320" y="128" font-size="18" fill="#243443">1  기존 벽</text><text x="320" y="166" font-size="18" fill="#243443">2  바이러스</text><rect x="320" y="192" width="46" height="46" rx="7" fill="#e8eff3"/><text x="333" y="222" font-size="18" fill="#243443">벽</text><rect x="371" y="192" width="46" height="46" rx="7" fill="#e8eff3"/><text x="384" y="222" font-size="18" fill="#243443">벽</text><rect x="422" y="192" width="46" height="46" rx="7" fill="#e8eff3"/><text x="435" y="222" font-size="18" fill="#243443">벽</text><text x="320" y="265" font-size="16" fill="#243443">위치가 아직 정해지지 않은 새 벽 세 개</text><text x="42" y="302" font-size="16" fill="#243443">새 벽의 정답 위치나 확산 결과는 표시하지 않습니다.</text></g></svg>
