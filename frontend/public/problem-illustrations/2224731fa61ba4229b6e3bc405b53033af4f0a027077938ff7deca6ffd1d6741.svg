<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>스위치와 문이 연결되는 상태 규칙</title><desc>소문자 스위치에 들어가면 해당 비트가 반전됩니다. 대문자 문은 들어가기 직전 해당 비트가 1이어야 통과할 수 있습니다. 처음에는 모든 비트가 0입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="42" font-size="18" fill="#243443">같은 글자의 스위치와 문이 연결되어 있어요</text><rect x="60" y="88" width="46" height="46" rx="7" fill="#e8eff3"/><text x="73" y="118" font-size="18" fill="#243443">a</text><path d="M145,111 L305,111" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="88" width="46" height="46" rx="7" fill="#e8eff3"/><text x="363" y="118" font-size="18" fill="#243443">A</text><text x="470" y="105" font-size="17" fill="#243443">a에 들어갈 때: 0 ↔ 1</text><text x="470" y="144" font-size="17" fill="#243443">A에 들어갈 때: 비트 1 필요</text><text x="60" y="218" font-size="18" fill="#243443">한 경로에서 방문했던 칸은 다시 밟을 수 없습니다.</text><text x="60" y="264" font-size="16" fill="#243443">정확히 L번 이동해야 합니다. 목적지까지의 경로는 표시하지 않습니다.</text></g></svg>
