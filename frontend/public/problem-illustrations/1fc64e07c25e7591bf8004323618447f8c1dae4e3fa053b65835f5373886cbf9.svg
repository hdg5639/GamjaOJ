<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>섬과 건설 가능한 다리 후보</title><desc>섬은 점, 건설할 수 있는 다리는 선으로 표시합니다. 숫자는 다리의 비용이며, 그림은 선택 전의 후보 연결을 보여줍니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><g fill="none" stroke="#91a5b3" stroke-width="3"><path d="M120,100 L350,80 L610,185 L120,100 L345,240 L350,80 M345,240 L610,185"/></g><circle cx="120" cy="100" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="111" y="106" font-size="18" fill="#243443">1</text><circle cx="350" cy="80" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="341" y="86" font-size="18" fill="#243443">2</text><circle cx="345" cy="240" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="336" y="246" font-size="18" fill="#243443">3</text><circle cx="610" cy="185" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="601" y="191" font-size="18" fill="#243443">4</text><text x="225" y="72" font-size="18" fill="#243443">5</text><text x="485" y="115" font-size="18" fill="#243443">7</text><text x="215" y="200" font-size="18" fill="#243443">3</text><text x="367" y="160" font-size="18" fill="#243443">4</text><text x="465" y="249" font-size="18" fill="#243443">6</text><text x="350" y="127" font-size="18" fill="#243443">8</text><text x="42" y="300" font-size="16" fill="#243443">모든 선은 후보입니다. 최소 비용의 다리를 골라 표시한 그림이 아닙니다.</text></g></svg>
