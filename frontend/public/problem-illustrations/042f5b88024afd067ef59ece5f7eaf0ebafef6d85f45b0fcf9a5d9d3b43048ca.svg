<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>좌표 위의 점과 두 점 사이의 직선 거리</title><desc>점의 위치는 평면 좌표로 주어집니다. 두 점을 잇는 비용은 두 점 사이의 유클리드 거리입니다. 선택할 연결을 표시한 그림은 아닙니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><path d="M95,265 L700,265" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M95,265 L95,45" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M190,210 L480,90" stroke="#35766d" stroke-width="3"/><circle cx="190" cy="210" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="181" y="216" font-size="18" fill="#243443">P</text><circle cx="480" cy="90" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="471" y="96" font-size="18" fill="#243443">Q</text><text x="215" y="242" font-size="16" fill="#243443">P(x₁, y₁)</text><text x="505" y="83" font-size="16" fill="#243443">Q(x₂, y₂)</text><text x="310" y="137" font-size="17" fill="#243443">두 점 사이의 거리</text><text x="708" y="270" font-size="18" fill="#243443">x</text><text x="85" y="35" font-size="18" fill="#243443">y</text></g></svg>
