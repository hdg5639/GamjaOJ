<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>하나의 명령을 함께 받는 두 로봇</title><desc>같은 방향 명령에도 벽에 막힌 로봇은 머무르고 다른 로봇은 움직입니다. 같은 칸에 도착하거나 서로 위치를 교환할 수 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="40" font-size="18" fill="#243443">공통 명령: 오른쪽으로 이동</text><text x="42" y="100" font-size="18" fill="#243443">로봇 A</text><rect x="155" y="70" width="46" height="46" rx="7" fill="#e8eff3"/><text x="168" y="100" font-size="18" fill="#243443">A</text><rect x="206" y="70" width="46" height="46" rx="7" fill="#e8eff3"/><text x="219" y="100" font-size="18" fill="#243443">#</text><rect x="257" y="70" width="46" height="46" rx="7" fill="#e8eff3"/><text x="270" y="100" font-size="18" fill="#243443">.</text><text x="370" y="101" font-size="18" fill="#243443">→ A는 벽 앞에 머무름</text><text x="42" y="177" font-size="18" fill="#243443">로봇 B</text><rect x="155" y="147" width="46" height="46" rx="7" fill="#e8eff3"/><text x="168" y="177" font-size="18" fill="#243443">B</text><rect x="206" y="147" width="46" height="46" rx="7" fill="#e8eff3"/><text x="219" y="177" font-size="18" fill="#243443">.</text><rect x="257" y="147" width="46" height="46" rx="7" fill="#e8eff3"/><text x="270" y="177" font-size="18" fill="#243443">.</text><path d="M177,211 L227,211" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="370" y="178" font-size="18" fill="#243443">→ B는 한 칸 이동</text><text x="42" y="285" font-size="16" fill="#243443">두 로봇의 이동 결과를 함께 확인합니다. 같은 칸 도착·자리 교환은 금지됩니다.</text></g></svg>
