<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>선수과목을 나타내는 방향 연결</title><desc>A → B는 A를 먼저 이수해야 B를 들을 수 있다는 뜻입니다. 두 과목을 같은 학기에 이수할 수 없으며, 한 학기의 수강 과목 수에는 제한이 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><path d="M135,110 L310,110" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M135,127 L310,218" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M357,110 L535,160" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M357,228 L535,180" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="105" cy="110" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="96" y="116" font-size="18" fill="#243443">A</text><circle cx="335" cy="110" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="326" y="116" font-size="18" fill="#243443">B</text><circle cx="335" cy="230" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="326" y="236" font-size="18" fill="#243443">C</text><circle cx="565" cy="170" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="556" y="176" font-size="18" fill="#243443">D</text><text x="170" y="83" font-size="16" fill="#243443">선수 관계</text><text x="42" y="295" font-size="17" fill="#243443">화살표 앞의 과목을 이전 학기에 이수해야 합니다.</text></g></svg>
