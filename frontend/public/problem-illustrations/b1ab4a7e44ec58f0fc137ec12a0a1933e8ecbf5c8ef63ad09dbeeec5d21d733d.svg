<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>커서를 기준으로 문자를 넣고 지우는 편집 명령</title><desc>TYPE은 커서 왼쪽에 문자를 넣고, DELETE는 커서 왼쪽 문자를 지웁니다. LEFT·RIGHT는 커서를 한 칸 이동하며 문서 밖으로 나가지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="43" font-size="18" fill="#243443">편집 명령과 커서의 위치</text><text x="60" y="102" font-size="30" fill="#243443">ab│cd</text><path d="M250,92 L385,92" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="68" font-size="15" fill="#243443">TYPE x</text><text x="430" y="102" font-size="30" fill="#243443">abx│cd</text><text x="60" y="199" font-size="30" fill="#243443">ab│cd</text><path d="M250,189 L385,189" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="165" font-size="15" fill="#243443">DELETE</text><text x="430" y="199" font-size="30" fill="#243443">a│cd</text><text x="60" y="284" font-size="16" fill="#243443">│는 문자가 아닌 커서입니다. 왼쪽에 문자가 없으면 DELETE는 무시합니다.</text></g></svg>
