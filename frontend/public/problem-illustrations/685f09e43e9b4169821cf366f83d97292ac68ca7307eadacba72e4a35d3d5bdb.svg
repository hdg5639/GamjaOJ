<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>트럭 대기열과 다리의 동시 진입 제한</title><desc>동시에 올라간 트럭 수와 무게 합을 모두 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="45" y="50" font-size="18" fill="#243443">대기 중</text><rect x="45" y="100" width="46" height="46" rx="7" fill="#e8eff3"/><text x="58" y="130" font-size="18" fill="#243443">a</text><rect x="96" y="100" width="46" height="46" rx="7" fill="#e8eff3"/><text x="109" y="130" font-size="18" fill="#243443">b</text><path d="M162,124 L245,124" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="270" y="90" width="390" height="95" rx="7" fill="#e8eff3"/><rect x="300" y="115" width="90" height="45" rx="7" fill="#c2ded4"/><text x="330" y="145" font-size="18" fill="#243443">p</text><rect x="460" y="115" width="90" height="45" rx="7" fill="#c2ded4"/><text x="490" y="145" font-size="18" fill="#243443">q</text><text x="285" y="215" font-size="18" fill="#243443">다리 위 트럭 수 ≤ W</text><text x="285" y="258" font-size="18" fill="#243443">다리 위 트럭 무게의 합 ≤ L</text><text x="45" y="307" font-size="15" fill="#243443">a·b·p·q는 트럭을 구분하기 위한 기호입니다.</text></g></svg>
