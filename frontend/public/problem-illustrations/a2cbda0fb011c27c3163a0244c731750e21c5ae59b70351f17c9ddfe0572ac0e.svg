<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>한 번의 이동 거리와 벽으로 끊기는 이동 범위</title><desc>한 번에 같은 행 또는 열로 1~K칸 이동합니다. 지나가는 모든 칸이 비어 있어야 하며 벽을 넘을 수 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="42" font-size="18" fill="#243443">이동 규칙을 보여주기 위한 K = 3 상황</text><rect x="70" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="83" y="120" font-size="18" fill="#243443">S</text><rect x="121" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="134" y="120" font-size="18" fill="#243443">.</text><rect x="172" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="185" y="120" font-size="18" fill="#243443">.</text><rect x="223" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="236" y="120" font-size="18" fill="#243443">#</text><rect x="274" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="287" y="120" font-size="18" fill="#243443">.</text><rect x="325" y="90" width="46" height="46" rx="7" fill="#e8eff3"/><text x="338" y="120" font-size="18" fill="#243443">.</text><path d="M92,165 L143,165" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M92,191 L194,191" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="125" font-size="18" fill="#243443">벽 뒤의 칸은 한 번에 갈 수 없음</text><text x="70" y="241" font-size="18" fill="#243443">한 칸 또는 두 칸 이동 가능 · 세 번째 칸은 벽</text><text x="70" y="281" font-size="17" fill="#243443">상하좌우 모두 같은 규칙이 적용됩니다.</text></g></svg>
