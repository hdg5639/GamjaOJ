<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>교차에 포함되는 선분의 세 가지 만남</title><desc>서로 가로지르는 경우뿐 아니라 끝점이 닿거나 같은 직선 위에서 겹치는 경우도 교차에 포함됩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="42" font-size="18" fill="#243443">교차로 보는 관계</text><g fill="none" stroke="#35766d" stroke-width="4"><path d="M60,100 L210,230 M60,230 L210,100"/><path d="M290,220 L390,110 L480,220"/><path d="M550,130 L710,130"/><path d="M590,130 L750,130" stroke="#c47b40" stroke-width="2"/></g><text x="80" y="270" font-size="18" fill="#243443">가로지름</text><text x="325" y="270" font-size="18" fill="#243443">끝점이 닿음</text><text x="566" y="270" font-size="16" fill="#243443">같은 직선에서 겹침</text><text x="548" y="302" font-size="11" fill="#243443">초록 선과 주황 선의 일부가 겹칩니다</text></g></svg>
