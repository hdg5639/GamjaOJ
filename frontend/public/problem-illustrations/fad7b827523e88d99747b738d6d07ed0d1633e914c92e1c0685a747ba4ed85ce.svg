<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>기존 나무 모양 다리와 추가된 다리</title><desc>실선은 기존 다리, 점선은 새로 추가된 다리입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><path d="M110,100 L325,80 L325,250 L600,210" fill="none" stroke="#91a5b3" stroke-width="3"/><path d="M110,100 L325,250" fill="none" stroke="#c47b40" stroke-width="3" stroke-dasharray="8 6"/><circle cx="110" cy="100" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="101" y="106" font-size="18" fill="#243443">1</text><circle cx="325" cy="80" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="316" y="86" font-size="18" fill="#243443">2</text><circle cx="325" cy="250" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="316" y="256" font-size="18" fill="#243443">3</text><circle cx="600" cy="210" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="591" y="216" font-size="18" fill="#243443">4</text><text x="70" y="220" font-size="16" fill="#243443">새 다리</text><text x="460" y="100" font-size="16" fill="#243443">기존 다리는 연결된 트리</text></g></svg>
