<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>방향이 있는 길과 길드 도장의 관계</title><desc>길에는 이동 비용과 길드 번호가 있습니다. 같은 길드의 가입세는 경로에서 처음 이용할 때만 내며, 길드 0에는 가입세가 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><path d="M130,110 L310,110" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M355,120 L535,200" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M135,132 L525,225" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="100" cy="110" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="91" y="116" font-size="18" fill="#243443">A</text><circle cx="335" cy="110" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="326" y="116" font-size="18" fill="#243443">B</text><circle cx="565" cy="220" r="26" fill="#e3f1eb" stroke="#35766d"/><text x="556" y="226" font-size="18" fill="#243443">C</text><text x="170" y="85" font-size="16" fill="#243443">비용 w · 길드 1</text><text x="405" y="128" font-size="16" fill="#243443">비용 w · 길드 1</text><text x="235" y="223" font-size="16" fill="#243443">비용 w · 길드 0</text><text x="42" y="290" font-size="17" fill="#243443">길드 1: 첫 이용 때 가입세 + 이동 비용 / 이후 이용은 이동 비용만</text></g></svg>
