<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>문 번호와 진입 가능한 박자의 관계</title><desc>숫자는 문을 통과할 수 있는 박자를 나타냅니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="55" y="50" font-size="18" fill="#243443">도착 시각의 나머지</text><rect x="65" y="95" width="46" height="46" rx="7" fill="#e8eff3"/><text x="78" y="125" font-size="18" fill="#243443">0</text><rect x="116" y="95" width="46" height="46" rx="7" fill="#e8eff3"/><text x="129" y="125" font-size="18" fill="#243443">1</text><rect x="167" y="95" width="46" height="46" rx="7" fill="#e8eff3"/><text x="180" y="125" font-size="18" fill="#243443">2</text><path d="M243,116 L332,116" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="370" y="121" font-size="18" fill="#243443">다시 0, 1, 2 순서로 반복</text><text x="65" y="215" font-size="18" fill="#243443">문 0 → t mod 3 = 0일 때 진입</text><text x="65" y="251" font-size="18" fill="#243443">문 1 → t mod 3 = 1일 때 진입</text><text x="65" y="287" font-size="18" fill="#243443">문 2 → t mod 3 = 2일 때 진입</text></g></svg>
