<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>도착하는 칸에 따라 달라지는 벽 파괴 비용</title><desc>0은 빈 칸, 1은 부술 수 있는 벽입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="55" y="50" font-size="18" fill="#243443">빈 칸으로 들어갈 때</text><rect x="65" y="82" width="46" height="46" rx="7" fill="#e8eff3"/><text x="78" y="112" font-size="18" fill="#243443">현재</text><rect x="116" y="82" width="46" height="46" rx="7" fill="#e8eff3"/><text x="129" y="112" font-size="18" fill="#243443">0</text><path d="M192,105 L300,105" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="350" y="112" font-size="18" fill="#243443">추가 비용 0</text><text x="55" y="205" font-size="18" fill="#243443">벽이 있는 칸으로 들어갈 때</text><rect x="65" y="237" width="46" height="46" rx="7" fill="#e8eff3"/><text x="78" y="267" font-size="18" fill="#243443">현재</text><rect x="116" y="237" width="46" height="46" rx="7" fill="#e8eff3"/><text x="129" y="267" font-size="18" fill="#243443">1</text><path d="M192,260 L300,260" stroke="#35766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="350" y="267" font-size="18" fill="#243443">추가 비용 1 · 벽 한 개 파괴</text></g></svg>
