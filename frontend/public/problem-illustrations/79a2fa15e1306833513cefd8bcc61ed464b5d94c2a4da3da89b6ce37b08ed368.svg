<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>파손된 칸이 있는 두 줄 벽면과 도미노 모양</title><desc>도미노 한 개는 변을 공유한 정상 칸 두 개를 덮습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><rect x="55" y="65" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="95" font-size="18" fill="#243443">.</text><rect x="106" y="65" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="95" font-size="18" fill="#243443">.</text><rect x="157" y="65" width="46" height="46" rx="7" fill="#aab9c3"/><text x="170" y="95" font-size="18" fill="#243443">#</text><rect x="208" y="65" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="95" font-size="18" fill="#243443">.</text><rect x="259" y="65" width="46" height="46" rx="7" fill="#e8eff3"/><text x="272" y="95" font-size="18" fill="#243443">.</text><rect x="310" y="65" width="46" height="46" rx="7" fill="#e8eff3"/><text x="323" y="95" font-size="18" fill="#243443">.</text><rect x="55" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="68" y="146" font-size="18" fill="#243443">.</text><rect x="106" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="119" y="146" font-size="18" fill="#243443">.</text><rect x="157" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="170" y="146" font-size="18" fill="#243443">.</text><rect x="208" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="221" y="146" font-size="18" fill="#243443">.</text><rect x="259" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="272" y="146" font-size="18" fill="#243443">.</text><rect x="310" y="116" width="46" height="46" rx="7" fill="#e8eff3"/><text x="323" y="146" font-size="18" fill="#243443">.</text><text x="55" y="220" font-size="18" fill="#243443">벽면: 2 × N / #은 파손된 칸</text><rect x="440" y="65" width="42" height="90" rx="7" fill="#c2ded4"/><rect x="555" y="85" width="90" height="42" rx="7" fill="#c2ded4"/><text x="410" y="205" font-size="16" fill="#243443">세로로 놓기</text><text x="545" y="205" font-size="16" fill="#243443">가로로 놓기</text><text x="390" y="265" font-size="16" fill="#243443">파손된 칸에 놓거나 블록을 겹칠 수 없음</text></g></svg>
