<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img"><title>두 필름을 같은 칸에 겹치는 방식</title><desc>B 전체를 A 안에 놓습니다. 같은 칸의 서로 다른 글자만 충돌하며, 물음표는 충돌하지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#35766d"/></marker></defs><rect width="800" height="340" rx="12" fill="#f8fafb"/><g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="42" y="42" font-size="18" fill="#243443">두 줄의 같은 위치를 비교해요</text><text x="42" y="104" font-size="18" fill="#243443">A</text><rect x="95" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="108" y="105" font-size="18" fill="#243443">A</text><rect x="146" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="159" y="105" font-size="18" fill="#243443">?</text><rect x="197" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="210" y="105" font-size="18" fill="#243443">B</text><rect x="248" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="261" y="105" font-size="18" fill="#243443">A</text><rect x="299" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="312" y="105" font-size="18" fill="#243443">C</text><rect x="350" y="75" width="46" height="46" rx="7" fill="#e8eff3"/><text x="363" y="105" font-size="18" fill="#243443">A</text><text x="42" y="164" font-size="18" fill="#243443">B</text><rect x="197" y="135" width="46" height="46" rx="7" fill="#e8eff3"/><text x="210" y="165" font-size="18" fill="#243443">B</text><rect x="248" y="135" width="46" height="46" rx="7" fill="#e8eff3"/><text x="261" y="165" font-size="18" fill="#243443">?</text><rect x="299" y="135" width="46" height="46" rx="7" fill="#e8eff3"/><text x="312" y="165" font-size="18" fill="#243443">A</text><text x="460" y="106" font-size="18" fill="#243443">같은 글자 → 충돌 없음</text><text x="460" y="146" font-size="18" fill="#243443">? 포함 → 충돌 없음</text><text x="460" y="186" font-size="18" fill="#243443">서로 다른 글자 → 충돌</text><text x="42" y="270" font-size="16" fill="#243443">위 그림은 겹치는 방식만 보여줍니다. 가장 좋은 위치를 나타내지는 않습니다.</text></g></svg>
