<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 112" role="img" aria-labelledby="title desc">
  <title id="title">GamjaOJ primary wordmark</title>
  <desc id="desc">GamjaOJ algorithm practice wordmark in the GamjaBox brand family.</desc>
  <defs>
    <linearGradient id="shell" x1="18" y1="13" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23342A"/>
      <stop offset=".52" stop-color="#17211B"/>
      <stop offset="1" stop-color="#0E1712"/>
    </linearGradient>
    <linearGradient id="flesh" x1="29" y1="27" x2="69" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset=".5" stop-color="#F7C548"/>
      <stop offset="1" stop-color="#E3A12C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06150D" flood-opacity=".23"/>
    </filter>
      <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;display=swap');
      .brand-name { font-family: Manrope, Inter, Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -3.1px; }
      .descriptor { font-family: Manrope, Inter, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; }
      .wm-symbol{transform-origin:48px 56px;opacity:0;animation:wmSymbolIn .62s cubic-bezier(.34,1.56,.64,1) .05s both}
      .wm-name{opacity:0;animation:wmSlideIn .5s cubic-bezier(.16,1,.3,1) .34s both}
      .wm-desc{opacity:0;animation:wmFadeIn .5s ease-out .6s both}
      @keyframes wmSymbolIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes wmSlideIn{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes wmFadeIn{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion:reduce){.wm-symbol,.wm-name,.wm-desc{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <g class="wm-symbol">
    <g transform="translate(0 8)" filter="url(#shadow)">
    <path
      d="M25.7 16.1C36.4 8.7 55.2 8.1 68.6 14.5C82.3 21.1 90.1 36.6 88.2 52.4C86.3 68.3 76.5 83.1 60.9 87.7C45.4 92.3 28.6 87.2 19.6 74.8C10.5 62.4 9.7 43.7 16.4 29.7C18.9 24.4 22 18.7 25.7 16.1Z"
      fill="url(#shell)"
    />
    <path d="M28.5 24.5C37 18.9 50.7 18 61.5 21.8" fill="none" stroke="white" stroke-opacity=".12" stroke-width="5.5" stroke-linecap="round"/>

    <circle cx="25.5" cy="46.5" r="2.7" fill="#07100B" opacity=".32"/>
    <circle cx="68" cy="30.5" r="2.3" fill="#07100B" opacity=".28"/>
    <circle cx="71" cy="67" r="3" fill="#07100B" opacity=".25"/>
    <circle cx="37" cy="75" r="2.2" fill="#07100B" opacity=".22"/>

    <rect x="27" y="27" width="42" height="42" rx="12" fill="white"/>
    <rect x="32" y="32" width="32" height="32" rx="9" fill="url(#flesh)"/>

    <path d="M41 41.5L35.8 48L41 54.5" fill="none" stroke="#17211B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 41.5L60.2 48L55 54.5" fill="none" stroke="#17211B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43.6 48.6L46.9 51.8L52.6 44.4" fill="none" stroke="#07874A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>

  <text x="100" y="70" class="brand-name wm-name">
    <tspan fill="#17211B">Gamja</tspan><tspan fill="#08B85B">OJ</tspan>
  </text>
  <text x="103" y="93" class="descriptor wm-desc" fill="#718078">GAMJABOX ALGORITHM PRACTICE</text>
</svg>
