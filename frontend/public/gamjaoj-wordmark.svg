<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 112" role="img" aria-labelledby="title desc">
  <title id="title">GamjaOJ primary wordmark</title>
  <desc id="desc">GamjaOJ algorithm practice wordmark in the GamjaBox brand family.</desc>
  <defs>
    <linearGradient id="gamjaoj-loader-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff58"/>
      <stop offset="1" stop-color="#62ffa8"/>
    </linearGradient>
      <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;display=swap');
      .brand-name { font-family: Manrope, Inter, Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -3.1px; }
      .descriptor { font-family: Manrope, Inter, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; }
      .wm-symbol{transform-origin:48px 56px;opacity:0;animation:wmSymbolIn .62s cubic-bezier(.34,1.56,.64,1) .05s both}
      .wm-name{opacity:0;animation:wmSlideIn .5s cubic-bezier(.16,1,.3,1) .34s both}
      .wm-desc{opacity:0;animation:wmFadeIn .5s ease-out .6s both}
      @keyframes wmSymbolIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes wmSlideIn{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes wmFadeIn{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion:reduce){.wm-symbol,.wm-name,.wm-desc{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <g class="wm-symbol"><g transform="translate(0 8) scale(2.5263157895)">
  <g>
    <path fill="url(#gamjaoj-loader-gradient)" d="M19 2.5 32.8 10v16L19 33.5 5.2 26V10L19 2.5Z"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#07100a" stroke-width="1.9" d="M13.5 13.7 9.7 19l3.8 5.3"/>
      <path stroke="#067543" stroke-width="2.1" pathLength="1" d="m15.9 19.1 2.7 2.7 4-5.3"/>
      <path stroke="#07100a" stroke-width="1.9" d="m24.5 13.7 3.8 5.3-3.8 5.3"/>
    </g>
  </g>
  </g></g>

  <text x="100" y="70" class="brand-name wm-name">
    <tspan fill="#17211B">Gamja</tspan><tspan fill="#08B85B">OJ</tspan>
  </text>
  <text x="103" y="93" class="descriptor wm-desc" fill="#718078">GAMJABOX ALGORITHM PRACTICE</text>
</svg>
