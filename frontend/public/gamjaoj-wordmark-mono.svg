<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 96" role="img" aria-labelledby="title">
  <title id="title">GamjaOJ monochrome wordmark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&amp;display=swap');
    .brand-name { font-family: Manrope, Inter, Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -3.1px; }
      .wm-symbol{transform-origin:48px 48px;opacity:0;animation:wmSymbolIn .62s cubic-bezier(.34,1.56,.64,1) .05s both}
      .wm-name{opacity:0;animation:wmSlideIn .5s cubic-bezier(.16,1,.3,1) .34s both}
      .wm-desc{opacity:0;animation:wmFadeIn .5s ease-out .6s both}
      @keyframes wmSymbolIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes wmSlideIn{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes wmFadeIn{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion:reduce){.wm-symbol,.wm-name,.wm-desc{animation:none!important;opacity:1!important}}
  </style>
  <g class="wm-symbol">
    <path d="M25.7 16.1C36.4 8.7 55.2 8.1 68.6 14.5C82.3 21.1 90.1 36.6 88.2 52.4C86.3 68.3 76.5 83.1 60.9 87.7C45.4 92.3 28.6 87.2 19.6 74.8C10.5 62.4 9.7 43.7 16.4 29.7C18.9 24.4 22 18.7 25.7 16.1Z" fill="currentColor"/>
    <rect x="27" y="27" width="42" height="42" rx="12" fill="white"/>
    <rect x="32" y="32" width="32" height="32" rx="9" fill="currentColor"/>
    <path d="M41 41.5L35.8 48L41 54.5M55 41.5L60.2 48L55 54.5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43.6 48.6L46.9 51.8L52.6 44.4" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="100" y="67" class="brand-name wm-name" fill="currentColor">GamjaOJ</text>
</svg>
