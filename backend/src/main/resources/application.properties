spring.application.name=gamjaoj
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/gamjaoj}
spring.datasource.username=${DB_USER:gamjaoj}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.session.jdbc.initialize-schema=never
spring.session.timeout=12h
server.servlet.session.cookie.name=GAMJAOJ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.max-age=12h
server.tomcat.max-http-form-post-size=8KB
server.tomcat.threads.max=30
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
gamjaoj.invite-code=${INVITE_CODE}
spring.jackson.deserialization.fail-on-unknown-properties=true
gamjaoj.submissions-enabled=${SUBMISSIONS_ENABLED:false}
gamjaoj.worker-token=${WORKER_TOKEN:}
